[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "budao-run-lab"
version = "0.1.0"
description = "Android emulator diagnostics and bounded dynamic-route automation lab"
requires-python = ">=3.11,<3.14"
dependencies = [
  "adbutils>=2.9,<3", "uiautomator2>=3,<4", "shapely>=2,<3",
  "networkx>=3,<4", "pyproj>=3,<4", "geographiclib>=2,<3",
  "pydantic>=2,<3", "httpx>=0.28,<1", "pillow>=11,<13", "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
budao = "budao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
budao = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
